# Leptid — release workflow.
#
# Triggers:
#   * pushing a version tag (vMAJOR.MINOR.PATCH) builds all three platforms
#     and publishes the GitHub Release:
#       git tag v0.1.3 && git push origin v0.1.3
#   * every push to `main` (or a manual dispatch) runs the same three builds
#     and uploads artifacts so the pipeline is verified before a release —
#     the publish step only runs for tags.
#
# How it maps to the repo:
#   * CMakeLists.txt + cmake/embed_assets.cmake + tools/bin2cpp.cpp
#       — one CMake configure/build for every OS (fonts + brush tips + icons
#         are embedded at build time; no checked-in generated sources needed).
#   * tools/patch_version.py
#       — stamps the tag version into src/core/version.cpp and
#         packaging/leptid.rc before building (exe metadata, --help banner).
#   * packaging/leptid.rc + assets/icons/leptid.ico
#       — icon + version info compiled into the Windows exe (RC; the icon
#         path resolves via the source-root include dir set in CMakeLists).
#   * tests/ (leptid_tests) — full suite runs on every platform.
#   * src/app/main.cpp --demo — headless smoke test of the render/export
#     pipeline (works even where no display backend exists, e.g. macOS).

name: release

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch: {}   # manual run for testing the pipeline itself

permissions:
  contents: write         # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            pkg: tar.gz
          - name: macos-universal
            os: macos-latest
            pkg: tar.gz
          - name: windows-x64
            os: windows-latest
            pkg: zip

    steps:
      - uses: actions/checkout@v5

      - name: Linux — install X11 dev libraries (GUI backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev pkg-config

      - name: Stamp version from tag (${{ github.ref_name }})
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 tools/patch_version.py "${GITHUB_REF_NAME#v}"
          else
            echo "not a version tag — keeping the checked-in version"
          fi

      # Deterministic generators: pin "Unix Makefiles" on Linux/macOS (the
      # macOS default can be Xcode, which double-runs shared custom commands
      # and breaks the embed step); keep the Visual Studio generator on
      # Windows so the .rc icon/version build matches MSVC packaging.
      - name: Configure (CMake, Release)
        shell: bash
        run: |
          ARGS=(-B build-ci -DCMAKE_BUILD_TYPE=Release)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARGS+=(-A x64)
          else
            ARGS+=(-G "Unix Makefiles")
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ARGS+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
          fi
          cmake "${ARGS[@]}"

      - name: Build
        shell: bash
        run: cmake --build build-ci --config Release --parallel 4

      # When the build fails, rebuild single-threaded and surface the first
      # compiler/linker errors as check-run annotations (visible on the run
      # page even when the raw log is not).
      - name: On failure — surface compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          cmake --build build-ci --config Release --parallel 1 > diag.log 2>&1 || true
          grep -E "error|fatal|LNK[0-9]|C[0-9]{4}" diag.log | grep -viE "warning" | head -30 > errs.txt || true
          if [ -s errs.txt ]; then
            while IFS= read -r l; do echo "::error title=build error::$l"; done < errs.txt
          else
            tail -40 diag.log
          fi

      # ctest resolves the per-generator executable path (multi-config
      # Visual Studio layouts the exe under build-ci/Release/).
      - name: Run test suite (2480 checks)
        shell: bash
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Headless demo smoke test (render + export pipeline)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE="build-ci/Release/leptid.exe"
          else
            EXE="build-ci/leptid"
          fi
          "$EXE" --demo /tmp/smoke.lep --gif /tmp/smoke.gif

      # ---- Linux: GUI binary + zero-dependency static single-file build ----
      - name: Linux — build static single-file binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make -j4 static
          mkdir -p dist/leptid-linux-x64
          cp build-ci/leptid dist/leptid-linux-x64/leptid
          cp bin/leptid-static dist/leptid-linux-x64/leptid-linux-x64-static
          cp README.md MANUAL.md LICENSE dist/leptid-linux-x64/
          cp demo/hello_leptid.lep dist/leptid-linux-x64/
          tar -czf leptid-${GITHUB_REF_NAME}-linux-x64.tar.gz -C dist leptid-linux-x64

      # ---- macOS: universal (arm64 + x86_64) headless build ----
      - name: macOS — package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/leptid-macos-universal
          cp build-ci/leptid dist/leptid-macos-universal/leptid
          cp README.md MANUAL.md LICENSE dist/leptid-macos-universal/
          cp demo/hello_leptid.lep dist/leptid-macos-universal/
          tar -czf leptid-${GITHUB_REF_NAME}-macos-universal.tar.gz -C dist leptid-macos-universal

      # ---- Windows: portable exe (static CRT, icon + version from the .rc) ----
      - name: Windows — package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/leptid-windows-x64
          cp build-ci/Release/leptid.exe dist/leptid-windows-x64/leptid.exe
          cp README.md MANUAL.md LICENSE dist/leptid-windows-x64/
          cp demo/hello_leptid.lep dist/leptid-windows-x64/
          7z a leptid-${GITHUB_REF_NAME}-windows-x64.zip ./dist/leptid-windows-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: leptid-${{ github.ref_name }}-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only publish for tag pushes
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Publish release with the three archives
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
